name: DevOpsLab CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devopslab:latest .

      - name: Test deployment script
        run: |
          chmod +x deploy.sh
          bash -n deploy.sh
